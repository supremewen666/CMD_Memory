[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmd-counterfactual-memory-debugger"
version = "0.1.0"
description = "Standalone CMD-Audit harness for counterfactual memory-failure probes."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
cmd-audit = "cmd_audit.cli:main"

[tool.setuptools.packages.find]
include = ["cmd_audit*", "experiments*"]

[tool.pytest.ini_options]
pythonpath = ["."]
